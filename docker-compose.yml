version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: bis_saarthi_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: bis_saarthi
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d bis_saarthi']
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: bis_saarthi_api
    restart: unless-stopped
    ports:
      - '4000:4000'
    environment:
      DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/bis_saarthi?schema=public"
      PORT: 4000
      NODE_ENV: production
      JWT_SECRET: "bis_prod_secret_key_2026_gov_portal"
      JWT_REFRESH_SECRET: "bis_prod_refresh_secret_2026_gov"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: bis_saarthi_web
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:4000/api/v1"
      NEXT_PUBLIC_APP_NAME: "BIS Saarthi"
    depends_on:
      - api

volumes:
  pgdata:
