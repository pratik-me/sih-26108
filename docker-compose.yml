version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: bis_saarthi_api
    restart: unless-stopped
    ports:
      - '4000:4000'
    env_file:
      - .env
    environment:
      PORT: 4000
      HOST: "0.0.0.0"
      NODE_ENV: production

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: bis_saarthi_web
    restart: unless-stopped
    ports:
      - '3000:3000'
    env_file:
      - .env
    environment:
      PORT: 3000
      NODE_ENV: production
      API_URL: "http://api:4000/api/v1"
      NEXT_PUBLIC_API_URL: "http://localhost:4000/api/v1"
    depends_on:
      - api
